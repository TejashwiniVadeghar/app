<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fridge Flavor App</title>
    <!-- Link your CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Link your JS with defer -->
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Welcome To whats in your Fridge!!!</h1>
    <div class="container">
    <h1>What's in my Fridge? 🍎</h1>
    <input type="text" id="ingredientInput" placeholder="Enter ingredients (e.g. apple, flour)">
    <button onclick="getRecipes()">Find Food</button>
    <script src="script.js" defer></script>
    <div id="recipeResults" class="grid">
        <!-- Recipes will appear here! -->
    </div>
</div>
</body>
</html>
